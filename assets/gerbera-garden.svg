<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
 <defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset=".48" stop-color="#fff1cf"/><stop offset="1" stop-color="#fff8e9"/></linearGradient>
  <radialGradient id="centerGlow"><stop stop-color="#fffdf8" stop-opacity=".96"/><stop offset=".55" stop-color="#fff9e9" stop-opacity=".8"/><stop offset="1" stop-color="#fff7e6" stop-opacity=".1"/></radialGradient>
  <radialGradient id="petal"><stop stop-color="#fffdf4"/><stop offset=".62" stop-color="#fff1b9"/><stop offset="1" stop-color="#f6c967"/></radialGradient>
  <radialGradient id="petalPink"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f7d9a2"/></radialGradient>
  <radialGradient id="center"><stop stop-color="#d38d35"/><stop offset=".6" stop-color="#e8ae45"/><stop offset="1" stop-color="#f5cf6a"/></radialGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  <g id="daisy">
   <g fill="url(#petal)" stroke="#f1c96f" stroke-opacity=".48" stroke-width="1.2">
    <ellipse cy="-31" rx="10" ry="25"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(22.5)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(45)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(67.5)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(90)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(112.5)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(135)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(157.5)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(180)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(202.5)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(225)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(247.5)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(270)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(292.5)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(315)"/><ellipse cy="-31" rx="10" ry="25" transform="rotate(337.5)"/>
   </g>
   <circle r="17" fill="url(#center)" stroke="#dca64b" stroke-width="1.5"/>
   <circle r="10" fill="none" stroke="#c88d36" stroke-opacity=".45" stroke-dasharray="1.8 3"/>
  </g>
  <g id="smallFlower">
   <g fill="#fff9e9" stroke="#f3d48c" stroke-width=".7"><ellipse cy="-13" rx="5" ry="10"/><ellipse cy="-13" rx="5" ry="10" transform="rotate(45)"/><ellipse cy="-13" rx="5" ry="10" transform="rotate(90)"/><ellipse cy="-13" rx="5" ry="10" transform="rotate(135)"/><ellipse cy="-13" rx="5" ry="10" transform="rotate(180)"/><ellipse cy="-13" rx="5" ry="10" transform="rotate(225)"/><ellipse cy="-13" rx="5" ry="10" transform="rotate(270)"/><ellipse cy="-13" rx="5" ry="10" transform="rotate(315)"/></g><circle r="7" fill="#e7b54d"/>
  </g>
 </defs>
 <rect width="1600" height="1000" fill="url(#paper)"/>
 <rect width="1600" height="1000" fill="url(#centerGlow)"/>
 <!-- soft garden silhouettes along the outer edges -->
 <g opacity=".17" fill="none" stroke="#d8b56c" stroke-width="2"><path d="M0 220 Q180 150 300 270 T560 240"/><path d="M1600 250 Q1420 160 1310 280 T1050 230"/><path d="M0 830 Q180 720 300 850 T530 820"/><path d="M1600 830 Q1450 720 1310 850 T1060 820"/></g>
 <g fill="#e9c66d" opacity=".28"><ellipse cx="95" cy="360" rx="10" ry="25" transform="rotate(-38 95 360)"/><ellipse cx="146" cy="415" rx="9" ry="20" transform="rotate(38 146 415)"/><ellipse cx="1490" cy="390" rx="10" ry="25" transform="rotate(38 1490 390)"/><ellipse cx="1450" cy="450" rx="8" ry="18" transform="rotate(-35 1450 450)"/><ellipse cx="85" cy="690" rx="8" ry="18" transform="rotate(48 85 690)"/><ellipse cx="1510" cy="700" rx="10" ry="22" transform="rotate(-38 1510 700)"/></g>
 <!-- large daisies -->
 <g opacity=".9"><use href="#daisy" transform="translate(95 90) scale(1.8)"/><use href="#daisy" transform="translate(1480 95) scale(1.55)"/><use href="#daisy" transform="translate(65 860) scale(1.65)"/><use href="#daisy" transform="translate(1510 875) scale(1.85)"/></g>
 <g opacity=".74"><use href="#daisy" transform="translate(270 225) scale(.75)"/><use href="#daisy" transform="translate(1350 250) scale(.82)"/><use href="#daisy" transform="translate(245 740) scale(.68)"/><use href="#daisy" transform="translate(1365 745) scale(.7)"/></g>
 <!-- small flower clusters -->
 <g opacity=".82"><use href="#smallFlower" transform="translate(220 100) scale(1.4)"/><use href="#smallFlower" transform="translate(325 130) scale(.9)"/><use href="#smallFlower" transform="translate(1370 110) scale(1.2)"/><use href="#smallFlower" transform="translate(1280 165) scale(.8)"/><use href="#smallFlower" transform="translate(180 875) scale(1.2)"/><use href="#smallFlower" transform="translate(300 805) scale(.9)"/><use href="#smallFlower" transform="translate(1385 875) scale(1.25)"/><use href="#smallFlower" transform="translate(1290 805) scale(.9)"/></g>
 <!-- drifting petals and tiny stars -->
 <g fill="#f1c96b" opacity=".65"><path d="M390 70 q20 -15 25 5 q-14 20 -25 -5z"/><path d="M1210 100 q20 -15 25 5 q-14 20 -25 -5z"/><path d="M390 900 q20 -15 25 5 q-14 20 -25 -5z"/><path d="M1190 900 q20 -15 25 5 q-14 20 -25 -5z"/></g>
 <g fill="#d9aa51" opacity=".5"><path d="M370 300 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/><path d="M1230 330 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/><path d="M350 650 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/><path d="M1260 660 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/></g>
 <g fill="#fff" opacity=".65"><circle cx="450" cy="160" r="4"/><circle cx="1145" cy="170" r="5"/><circle cx="430" cy="790" r="4"/><circle cx="1160" cy="790" r="4"/><circle cx="310" cy="550" r="3"/><circle cx="1290" cy="550" r="3"/><circle cx="500" cy="900" r="3"/><circle cx="1100" cy="90" r="3"/></g>
